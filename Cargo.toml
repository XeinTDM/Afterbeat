[package]
name = "afterbeat"
version = "1.2.7"
edition = "2024"
rust-version = "1.99.1"
description = "Desktop auto-clicker and key repeater with routes, presets, and safety controls"
license = "MIT"
repository = "https://github.com/XeinTDM/Afterbeat"
readme = "README.md"
publish = false
build = "build.rs"

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "accessibility", "raw-window-handle-06"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
async-channel = "2.5"
async-io = "2.6"
futures-lite = "2.6"
rustix = { version = "1.1", features = ["event"] }
slint = { version = "=1.18.1", default-features = false, features = ["unstable-winit-030"] }
x11rb = { version = "0.13.2", features = ["allow-unsafe-code", "randr", "res", "xinput", "xkb", "xtest"] }
xkbcommon-dl = { version = "0.4.2", features = ["x11"] }
xkeysym = "0.2.1"
zbus = "5.19"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
libc = "0.2"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSRunningApplication", "NSResponder", "NSView", "NSWindow", "NSWorkspace", "libc"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFData", "CFDictionary", "CFMachPort", "CFNumber", "CFRunLoop", "CFString"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["CGDirectDisplay", "CGError", "CGEvent", "CGEventSource", "CGEventTypes", "CGRemoteOperation", "CGWindow", "libc"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSNotification", "NSOperation", "NSString", "block2"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
slint-build = "=1.18.1"
winresource = "0.1"

[profile.release]
lto = "thin"
strip = "debuginfo"
