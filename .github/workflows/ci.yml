name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 verification
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install delivery test dependencies
        run: python -m pip install -r scripts/delivery/requirements.txt
      - name: Test the delivery tools
        run: python -B -m unittest discover -s scripts/delivery -p 'test_*.py'
      - name: Verify the app
        run: ./scripts/verify.ps1
      - name: Package Windows x64 downloads
        run: ./scripts/package.ps1
      - name: Upload Windows package and UI renders
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-verification
          path: |
            target/dist/
            target/verification/previews/
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux x64 verification
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build and X11 test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-daemon desktop-file-utils libfontconfig1-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-0 python3-gi python3-xlib weston xauth xvfb
      - name: Verify the app, X11 delivery, and Wayland
        env:
          PYTHON: /usr/bin/python3
        run: bash scripts/verify.sh
      - name: Package Linux x64 archive
        run: bash scripts/package.sh
      - name: Upload Linux package and UI renders
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-x64-verification
          path: |
            target/dist/
            target/verification/previews/
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS ${{ matrix.arch }} verification
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-15 }
          - { arch: x64, runner: macos-15-intel }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the app
        run: bash scripts/verify-macos.sh
      - name: Package the macOS app bundle
        run: bash scripts/package-macos.sh
      - name: Upload macOS package and UI renders
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ matrix.arch }}-verification
          path: |
            target/dist/
            target/verification/previews/
          if-no-files-found: error
          retention-days: 7

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
