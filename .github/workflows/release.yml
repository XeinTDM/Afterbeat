name: Draft release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and package Windows x64
    runs-on: windows-2025
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release tag and source
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ($env:GITHUB_REF_NAME -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw 'Release tags must use vMAJOR.MINOR.PATCH.'
          }
          git merge-base --is-ancestor HEAD "refs/remotes/origin/$env:DEFAULT_BRANCH"
          if ($LASTEXITCODE -ne 0) { throw 'The tag must point to a commit on the default branch.' }
      - name: Verify the app
        run: ./scripts/verify.ps1
      - name: Package tagged version
        run: ./scripts/package.ps1 -Tag $env:GITHUB_REF_NAME
      - name: Attest the portable ZIP
        if: github.event.repository.private == false
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/dist/Afterbeat-${{ github.ref_name }}-windows-x64.zip
      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: target/dist/
          if-no-files-found: error
          retention-days: 7

  draft:
    name: Create GitHub release draft
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - name: Check SHA-256 and draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum --check --strict SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" "Afterbeat-${GITHUB_REF_NAME}-windows-x64.zip" SHA256SUMS.txt \
            --verify-tag --draft --generate-notes --title "Afterbeat $GITHUB_REF_NAME"
