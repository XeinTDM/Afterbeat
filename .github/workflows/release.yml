name: Draft release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and package Windows x64
    runs-on: windows-2025
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release tag and source
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if ($env:GITHUB_REF_NAME -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw 'Release tags must use vMAJOR.MINOR.PATCH.'
          }
          git merge-base --is-ancestor HEAD "refs/remotes/origin/$env:DEFAULT_BRANCH"
          if ($LASTEXITCODE -ne 0) { throw 'The tag must point to a commit on the default branch.' }
      - name: Verify the app
        run: ./scripts/verify.ps1
      - name: Package tagged version
        run: ./scripts/package.ps1 -Tag $env:GITHUB_REF_NAME
      - name: Attest the portable ZIP
        if: github.event.repository.private == false
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/dist/Afterbeat-${{ github.ref_name }}-windows-x64.zip
      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-x64
          path: target/dist/
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Verify and package Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release tag and source
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Release tags must use vMAJOR.MINOR.PATCH.' >&2
            exit 1
          fi
          git merge-base --is-ancestor HEAD "refs/remotes/origin/$DEFAULT_BRANCH" ||
            { echo 'The tag must point to a commit on the default branch.' >&2; exit 1; }
      - name: Install Linux build and X11 test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus-daemon desktop-file-utils libfontconfig1-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-0 python3-gi python3-xlib weston xauth xvfb
      - name: Verify the app, X11 delivery, and Wayland
        env:
          PYTHON: /usr/bin/python3
        run: bash scripts/verify.sh
      - name: Package tagged version
        run: bash scripts/package.sh "$GITHUB_REF_NAME"
      - name: Attest the portable archive
        if: github.event.repository.private == false
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/dist/Afterbeat-${{ github.ref_name }}-linux-x64.tar.gz
      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-x64
          path: target/dist/
          if-no-files-found: error
          retention-days: 7

  macos:
    name: Verify and package macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-15 }
          - { arch: x64, runner: macos-15-intel }
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release tag and source
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Release tags must use vMAJOR.MINOR.PATCH.' >&2
            exit 1
          fi
          git merge-base --is-ancestor HEAD "refs/remotes/origin/$DEFAULT_BRANCH" ||
            { echo 'The tag must point to a commit on the default branch.' >&2; exit 1; }
      - name: Verify the app
        run: bash scripts/verify-macos.sh
      - name: Package tagged version
        run: bash scripts/package-macos.sh "$GITHUB_REF_NAME"
      - name: Attest the app archive
        if: github.event.repository.private == false
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/dist/Afterbeat-${{ github.ref_name }}-macos-${{ matrix.arch }}.zip
      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos-${{ matrix.arch }}
          path: target/dist/
          if-no-files-found: error
          retention-days: 7

  draft:
    name: Create GitHub release draft
    needs: [build, linux, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
      - name: Check SHA-256 and draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          windows="Afterbeat-${GITHUB_REF_NAME}-windows-x64.zip"
          linux="Afterbeat-${GITHUB_REF_NAME}-linux-x64.tar.gz"
          mac_arm="Afterbeat-${GITHUB_REF_NAME}-macos-arm64.zip"
          mac_intel="Afterbeat-${GITHUB_REF_NAME}-macos-x64.zip"
          mv -- "release-windows-x64/$windows" "release-linux-x64/$linux" \
            "release-macos-arm64/$mac_arm" "release-macos-x64/$mac_intel" .
          cat release-{windows-x64,linux-x64,macos-arm64,macos-x64}/SHA256SUMS.txt > SHA256SUMS.txt
          sha256sum --check --strict SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" "$windows" "$linux" "$mac_arm" "$mac_intel" SHA256SUMS.txt \
            --verify-tag --draft --generate-notes --title "Afterbeat $GITHUB_REF_NAME"
